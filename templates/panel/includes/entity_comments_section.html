<section class="panel-card panel-chat-card">
  <div class="panel-chat-header">
    <h2>Комментарии</h2>
  </div>

  <div class="panel-chat-thread">
    {% for comment in entity_comments %}
      <article class="panel-chat-message{% if comment.author_id == request.user.id %} panel-chat-message-own{% endif %}">
        <div class="panel-chat-message-meta">
          <span class="panel-chat-author">{{ comment.author }}</span>
          <time>{{ comment.commented_at|date:"d.m.Y H:i" }}</time>
        </div>
        <div class="panel-chat-bubble">{{ comment.text|linebreaksbr }}</div>
      </article>
    {% empty %}
      <div class="panel-empty">Комментариев пока нет. Начните обсуждение первым.</div>
    {% endfor %}
  </div>

  {% if comments_enabled %}
    <form method="post" class="panel-chat-form">
      {% csrf_token %}
      <input
        type="text"
        name="comment_text"
        class="panel-input panel-chat-input"
        placeholder="Напишите комментарий..."
      >
      <button type="submit" class="panel-btn panel-btn-primary">Отправить</button>
    </form>
  {% endif %}
</section>
