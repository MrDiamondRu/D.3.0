<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{{ psi_busy_ranges|json_script:"ori-psi-busy-ranges" }}
{{ psi_history_items|json_script:"ori-psi-history" }}
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var psiModal = document.querySelector("[data-psi-modal]");
    var psiModalClose = document.querySelector("[data-psi-modal-close]");
    var psiForm = document.querySelector("[data-psi-form]");
    var psiStartInput = psiForm ? psiForm.querySelector('[name="start_date"]') : null;
    var psiEndInput = psiForm ? psiForm.querySelector('[name="end_date"]') : null;
    var psiDateRangeField = document.querySelector("[data-psi-date-range-field]");
    var psiDateRangeInput = document.querySelector("[data-psi-date-range]");
    var psiNativeDateFields = document.querySelectorAll("[data-psi-native-date-field]");
    var psiResponsibleSelect = document.getElementById("id_responsible");
    var psiActionInput = document.querySelector("[data-psi-action-input]");
    var psiIdInput = document.querySelector("[data-psi-id-input]");
    var psiModalTitle = document.querySelector("[data-psi-modal-title]");
    var psiSubmitBtn = document.querySelector("[data-psi-submit-btn]");
    var psiHistoryModal = document.querySelector("[data-psi-history-modal]");
    var psiHistoryModalClose = document.querySelector("[data-psi-history-close]");
    var psiHistoryList = document.querySelector("[data-psi-history-list]");
    var psiHistoryPrev = document.querySelector("[data-psi-history-prev]");
    var psiHistoryNext = document.querySelector("[data-psi-history-next]");
    var psiHistoryPage = document.querySelector("[data-psi-history-page]");
    var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
    var csrfToken = csrfInput ? csrfInput.value : "";
    var psiTodayIso = "{{ psi_assigned_today|date:'Y-m-d' }}";
    var busyRangesNode = document.getElementById("ori-psi-busy-ranges");
    var historyNode = document.getElementById("ori-psi-history");
    var busyRanges = [];
    var historyItems = [];
    var psiRangePicker = null;
    var psiChoices = null;
    var historyPage = 1;
    var historyPageSize = 6;

    if (busyRangesNode) {
      try {
        busyRanges = JSON.parse(busyRangesNode.textContent || "[]");
      } catch (e) {
        busyRanges = [];
      }
    }
    if (historyNode) {
      try {
        historyItems = JSON.parse(historyNode.textContent || "[]");
      } catch (e) {
        historyItems = [];
      }
    }

    if (window.Choices && psiResponsibleSelect) {
      psiChoices = new window.Choices(psiResponsibleSelect, {
        searchEnabled: true,
        searchPlaceholderValue: "Поиск пользователя...",
        noResultsText: "Ничего не найдено",
        noChoicesText: "Пользователи не найдены",
        itemSelectText: "",
        shouldSort: false,
        allowHTML: false
      });
    }

    function toIsoDate(dateObj) {
      var y = dateObj.getFullYear();
      var m = String(dateObj.getMonth() + 1).padStart(2, "0");
      var d = String(dateObj.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function toDateObject(value) {
      if (!value) return null;
      var parts = value.split("-");
      if (parts.length !== 3) return null;
      var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return Number.isNaN(dt.getTime()) ? null : dt;
    }

    function getBusyRanges() {
      return busyRanges.map(function (item) {
        var start = toDateObject(item.start);
        var end = toDateObject(item.end);
        if (!start || !end) return null;
        if (end < start) {
          var tmp = start;
          start = end;
          end = tmp;
        }
        return { start: start, end: end, operatorName: item.operator_name || "—" };
      }).filter(Boolean);
    }

    function paintBusyRanges(fpInstance) {
      if (!fpInstance || !fpInstance.calendarContainer) return;
      var ranges = getBusyRanges();
      fpInstance.calendarContainer.querySelectorAll(".flatpickr-day").forEach(function (day) {
        day.classList.remove("panel-flatpickr-busy");
        day.removeAttribute("title");
        if (!day.dateObj) return;
        var labels = [];
        ranges.forEach(function (range) {
          if (day.dateObj >= range.start && day.dateObj <= range.end) {
            labels.push(range.operatorName);
          }
        });
        if (labels.length) {
          day.classList.add("panel-flatpickr-busy");
          day.setAttribute("title", "Занято ПСИ: " + Array.from(new Set(labels)).join(", "));
        }
      });
    }

    function initRangeCalendar() {
      if (!window.flatpickr || !psiDateRangeInput || !psiStartInput || !psiEndInput) return;
      if (window.flatpickr.l10ns && window.flatpickr.l10ns.ru) {
        window.flatpickr.localize(window.flatpickr.l10ns.ru);
      }
      psiNativeDateFields.forEach(function (field) {
        field.classList.add("panel-hidden");
      });
      if (psiDateRangeField) {
        psiDateRangeField.classList.remove("panel-hidden");
      }
      var defaults = [];
      if (psiStartInput.value) defaults.push(psiStartInput.value);
      if (psiEndInput.value) defaults.push(psiEndInput.value);
      if (!defaults.length && psiTodayIso) {
        defaults = [psiTodayIso, psiTodayIso];
        psiStartInput.value = psiTodayIso;
        psiEndInput.value = psiTodayIso;
      }
      psiRangePicker = window.flatpickr(psiDateRangeInput, {
        mode: "range",
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d.m.Y",
        showMonths: 2,
        defaultDate: defaults.length ? defaults : null,
        onChange: function (selectedDates) {
          psiStartInput.value = selectedDates.length >= 1 ? toIsoDate(selectedDates[0]) : "";
          psiEndInput.value = selectedDates.length >= 2 ? toIsoDate(selectedDates[1]) : "";
          paintBusyRanges(psiRangePicker);
        },
        onReady: function () { paintBusyRanges(psiRangePicker); },
        onMonthChange: function () { paintBusyRanges(psiRangePicker); },
        onYearChange: function () { paintBusyRanges(psiRangePicker); },
        onOpen: function () { paintBusyRanges(psiRangePicker); }
      });
    }

    function openPsiModal(payload) {
      if (!psiModal) return;
      payload = payload || {};
      if (psiModalTitle) psiModalTitle.textContent = payload.mode === "edit" ? "Изменить ПСИ" : "Назначить ПСИ";
      if (psiSubmitBtn) psiSubmitBtn.textContent = payload.mode === "edit" ? "Сохранить" : "Назначить";
      if (psiActionInput) psiActionInput.value = payload.mode === "edit" ? "edit_psi" : "create_psi";
      if (psiIdInput) psiIdInput.value = payload.psiId || "";
      if (psiResponsibleSelect) {
        var responsibleValue = payload.responsible || "";
        if (psiChoices) {
          psiChoices.removeActiveItems();
          if (responsibleValue) psiChoices.setChoiceByValue(responsibleValue);
        } else {
          psiResponsibleSelect.value = responsibleValue;
        }
      }
      psiModal.hidden = false;
      if (psiRangePicker) {
        var start = payload.startDate || psiTodayIso;
        var end = payload.endDate || start || psiTodayIso;
        psiRangePicker.setDate([start, end], true);
        paintBusyRanges(psiRangePicker);
      }
    }

    function closePsiModal() {
      if (psiModal) psiModal.hidden = true;
    }

    document.querySelectorAll("[data-psi-create-open]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openPsiModal({ mode: "create" });
      });
    });
    document.querySelectorAll("[data-psi-edit-open]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openPsiModal({
          mode: "edit",
          psiId: btn.getAttribute("data-psi-id") || "",
          responsible: btn.getAttribute("data-psi-responsible") || "",
          startDate: btn.getAttribute("data-psi-start") || psiTodayIso,
          endDate: btn.getAttribute("data-psi-end") || btn.getAttribute("data-psi-start") || psiTodayIso
        });
      });
    });

    function renderHistory() {
      if (!psiHistoryList) return;
      var totalPages = Math.max(1, Math.ceil(historyItems.length / historyPageSize));
      if (historyPage > totalPages) historyPage = totalPages;
      var startIdx = (historyPage - 1) * historyPageSize;
      var pageItems = historyItems.slice(startIdx, startIdx + historyPageSize);
      if (!pageItems.length) {
        psiHistoryList.innerHTML = '<div class="panel-empty">История ПСИ пока пуста.</div>';
      } else {
        psiHistoryList.innerHTML = pageItems.map(function (item) {
          return '<article class="panel-license-psi-card panel-license-psi-card-compact">'
            + '<div class="panel-license-psi-grid panel-license-psi-grid-compact">'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-status">'
            + '<form method="post" class="panel-psi-status-form">'
            + '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrfToken + '">'
            + '<input type="hidden" name="action" value="update_psi_status">'
            + '<input type="hidden" name="psi_id" value="' + item.id + '">'
            + '<label class="panel-psi-status-field">'
            + '<span class="panel-license-psi-status-label">Статус</span>'
            + '<select name="status" class="panel-input panel-input-compact panel-psi-status-select" onchange="this.form.submit()">'
            + '{% for value, label in psi_status_choices %}'
            + '<option value="{{ value }}" ' + (item.status_value === "{{ value }}" ? 'selected' : '') + '>{{ label }}</option>'
            + '{% endfor %}'
            + '</select></label></form></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-date"><span class="panel-license-psi-inline-label">Дата начала</span><strong>' + item.start_date + '</strong></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-meta"><span class="panel-license-psi-inline-label">Назначил</span><strong>' + item.created_by + '</strong></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-action">'
            + '<button type="button" class="panel-icon-action-btn" title="Изменить ПСИ" aria-label="Изменить ПСИ"'
            + ' data-psi-edit-open data-psi-id="' + item.id + '"'
            + ' data-psi-responsible="' + item.responsible_id + '" data-psi-start="' + item.start_iso + '" data-psi-end="' + item.end_iso + '">✎</button></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-owner"><strong>Ответственный: ' + item.responsible + '</strong></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-date"><span class="panel-license-psi-inline-label">Дата окончания</span><strong>' + item.end_date + '</strong></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-meta"><span class="panel-license-psi-inline-label">Дата назначения</span><strong>' + item.created_at + '</strong></div>'
            + '<div class="panel-license-psi-cell panel-license-psi-cell-action"><form method="post">'
            + '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrfToken + '">'
            + '<input type="hidden" name="action" value="delete_psi">'
            + '<input type="hidden" name="psi_id" value="' + item.id + '">'
            + '<button type="submit" class="panel-icon-action-btn panel-icon-action-btn-danger" title="Удалить ПСИ" aria-label="Удалить ПСИ">🗑</button>'
            + '</form></div>'
            + '</div></article>';
        }).join("");
        psiHistoryList.querySelectorAll("[data-psi-edit-open]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            closeHistory();
            openPsiModal({
              mode: "edit",
              psiId: btn.getAttribute("data-psi-id") || "",
              responsible: btn.getAttribute("data-psi-responsible") || "",
              startDate: btn.getAttribute("data-psi-start") || psiTodayIso,
              endDate: btn.getAttribute("data-psi-end") || btn.getAttribute("data-psi-start") || psiTodayIso
            });
          });
        });
      }
      if (psiHistoryPage) psiHistoryPage.textContent = "Стр. " + historyPage + " / " + totalPages;
      if (psiHistoryPrev) psiHistoryPrev.disabled = historyPage <= 1;
      if (psiHistoryNext) psiHistoryNext.disabled = historyPage >= totalPages;
    }

    function openHistory() {
      historyPage = 1;
      if (psiHistoryModal) psiHistoryModal.hidden = false;
      renderHistory();
    }
    function closeHistory() {
      if (psiHistoryModal) psiHistoryModal.hidden = true;
    }

    document.querySelectorAll("[data-psi-history-open]").forEach(function (btn) {
      btn.addEventListener("click", openHistory);
    });
    if (psiHistoryPrev) psiHistoryPrev.addEventListener("click", function () { historyPage -= 1; renderHistory(); });
    if (psiHistoryNext) psiHistoryNext.addEventListener("click", function () { historyPage += 1; renderHistory(); });
    if (psiHistoryModalClose) psiHistoryModalClose.addEventListener("click", closeHistory);
    if (psiModalClose) psiModalClose.addEventListener("click", closePsiModal);

    initRangeCalendar();

    if (psiForm) {
      psiForm.addEventListener("submit", function () {
        if (psiRangePicker && psiRangePicker.selectedDates && psiRangePicker.selectedDates.length) {
          var start = psiRangePicker.selectedDates[0];
          var end = psiRangePicker.selectedDates[1] || psiRangePicker.selectedDates[0];
          psiStartInput.value = toIsoDate(start);
          psiEndInput.value = toIsoDate(end);
        }
      });
    }

    {% if psi_modal_open %}
      openPsiModal({
        mode: "{{ psi_modal_mode|default:'create' }}",
        psiId: "{% if psi_modal_psi %}{{ psi_modal_psi.pk }}{% endif %}",
        responsible: "{% if psi_modal_psi and psi_modal_psi.responsible_id %}{{ psi_modal_psi.responsible_id }}{% endif %}",
        startDate: "{% if psi_form.start_date.value %}{{ psi_form.start_date.value }}{% endif %}",
        endDate: "{% if psi_form.end_date.value %}{{ psi_form.end_date.value }}{% endif %}"
      });
      if (psiRangePicker && psiStartInput && psiEndInput && (psiStartInput.value || psiEndInput.value)) {
        psiRangePicker.setDate([psiStartInput.value || psiTodayIso, psiEndInput.value || psiStartInput.value || psiTodayIso], true);
        paintBusyRanges(psiRangePicker);
      }
    {% endif %}
  });
</script>

<div class="panel-modal-backdrop" data-psi-modal {% if not psi_modal_open %}hidden{% endif %}>
  <div class="panel-modal-card" role="dialog" aria-modal="true" aria-label="Назначение ПСИ">
    <div class="panel-modal-head">
      <h3 data-psi-modal-title>{% if psi_modal_mode == 'edit' %}Изменить ПСИ{% else %}Назначить ПСИ{% endif %}</h3>
      <button type="button" class="panel-modal-close" data-psi-modal-close aria-label="Закрыть">✕</button>
    </div>
    <form method="post" class="panel-form" autocomplete="off" data-psi-form>
      {% csrf_token %}
      <input type="hidden" name="action" value="{% if psi_modal_mode == 'edit' %}edit_psi{% else %}create_psi{% endif %}" data-psi-action-input>
      <input type="hidden" name="psi_id" value="{% if psi_modal_psi %}{{ psi_modal_psi.pk }}{% endif %}" data-psi-id-input>

      <div class="panel-form-grid">
        <label class="panel-form-field panel-form-field-full">
          <span class="panel-form-label">ОРИ</span>
          <input type="text" class="panel-input" value="{{ ori.name }}" disabled>
        </label>
        <label class="panel-form-field panel-form-field-full">
          <span class="panel-form-label">{{ psi_form.responsible.label }}</span>
          {{ psi_form.responsible }}
          {% if psi_form.responsible.errors %}
            <span class="panel-form-error">{{ psi_form.responsible.errors|striptags }}</span>
          {% endif %}
        </label>
        <label class="panel-form-field panel-form-field-full panel-hidden" data-psi-date-range-field>
          <span class="panel-form-label">Период ПСИ</span>
          <input type="text" class="panel-input" data-psi-date-range placeholder="Выберите диапазон дат" autocomplete="off">
          <span class="panel-form-help">Занятые дни по этой ОРИ подсвечены цветом.</span>
        </label>
        <label class="panel-form-field" data-psi-native-date-field>
          <span class="panel-form-label">{{ psi_form.start_date.label }}</span>
          {{ psi_form.start_date }}
          {% if psi_form.start_date.errors %}
            <span class="panel-form-error">{{ psi_form.start_date.errors|striptags }}</span>
          {% endif %}
        </label>
        <label class="panel-form-field" data-psi-native-date-field>
          <span class="panel-form-label">{{ psi_form.end_date.label }}</span>
          {{ psi_form.end_date }}
          {% if psi_form.end_date.errors %}
            <span class="panel-form-error">{{ psi_form.end_date.errors|striptags }}</span>
          {% endif %}
        </label>
        <label class="panel-form-field">
          <span class="panel-form-label">Кто назначил</span>
          <input type="text" class="panel-input" value="{{ request.user.get_full_name|default:request.user.username }}" disabled>
        </label>
        <label class="panel-form-field">
          <span class="panel-form-label">Дата назначения</span>
          <input type="text" class="panel-input" value="{{ psi_assigned_today|date:'d.m.Y' }}" disabled>
        </label>
      </div>
      <div class="panel-form-actions">
        <button type="submit" class="panel-btn panel-btn-primary" data-psi-submit-btn>{% if psi_modal_mode == 'edit' %}Сохранить{% else %}Назначить{% endif %}</button>
      </div>
    </form>
  </div>
</div>

<div class="panel-modal-backdrop" data-psi-history-modal hidden>
  <div class="panel-modal-card panel-modal-card-wide" role="dialog" aria-modal="true" aria-label="История ПСИ">
    <div class="panel-modal-head">
      <h3>История ПСИ</h3>
      <button type="button" class="panel-modal-close" data-psi-history-close aria-label="Закрыть">✕</button>
    </div>
    <div class="panel-form">
      <div class="panel-license-psi-history-list" data-psi-history-list></div>
      <div class="panel-history-pagination">
        <button type="button" class="panel-btn panel-btn-secondary" data-psi-history-prev>Назад</button>
        <span data-psi-history-page>Стр. 1 / 1</span>
        <button type="button" class="panel-btn panel-btn-secondary" data-psi-history-next>Вперед</button>
      </div>
    </div>
  </div>
</div>
